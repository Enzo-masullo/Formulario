<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-straight/css/uicons-regular-straight.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-chubby/css/uicons-thin-chubby.css'>
    <link rel="icon" href="imagens/usuario-do-circulo2.png">
    <link rel="stylesheet" href="style/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <div class="container">
        <div class="divback">
        <nav><a href="index.html"><i class="fi fi-ts-arrow-circle-left" id="back"></i></a></nav>
        </div>
        <form action="" class="">

            <div class="icon"><i class="fi fi-tc-user-add"></i></div>

            <fieldset>
                
            <input type="text" placeholder="Nome completo" required><i class="fi fi-rs-user-pen"></i>
            </fieldset>

            <br><br>

            <fieldset>
              
            <input type="email" placeholder="Email" required><i class="fi fi-rr-envelope"></i>
            </fieldset>

            <br><br>

            <fieldset>
                
            <input type="password" placeholder="Senha" required><i class="fi fi-rr-lock"></i>
            </fieldset>

            <br><br>

            <input type="submit" value="Cadastrar-se">
            <br>

            <p>Você já tem uma conta? <a href="index.html" >Entrar</a></p>
            
        </div>

        </form>
       
    </div>
</body>
</html>
